---
# Builds the VSeerr container image and publishes it to the GitHub Container
# Registry as ghcr.io/<owner>/<repo>.
#
# Seerr's own image jobs (ci.yml, release.yml) publish to Seerr's registries and
# only run on Seerr's branches, so VSeerr publishes its image here.
#
# Tags:
#   <X.Y.Z>-vseerr.<N>  each build of main: the Seerr release it is based on
#                       plus a VSeerr build number (see GitVersion.yml)
#   main                latest build of main
#   sha-<short sha>     one per commit, never moved
#
# Pull requests that touch the image build it without publishing.
name: 'VSeerr Image'

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/vseerr-image.yml
  workflow_dispatch:

permissions: {}

env:
  # renovate: datasource=github-releases depName=GitTools/GitVersion
  GITVERSION_VERSION: '6.8.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitVersion counts commits since the Seerr release.
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Seerr's release tags are the version base (GitVersion.yml).
          git fetch --quiet --no-tags https://github.com/seerr-team/seerr.git '+refs/tags/v*:refs/tags/v*'
          $archive = "gitversion-linux-x64-$env:GITVERSION_VERSION.tar.gz"
          gh release download $env:GITVERSION_VERSION --repo GitTools/GitVersion --pattern $archive --dir $env:RUNNER_TEMP
          # Only run a GitVersion binary built by GitVersion's own release workflow.
          gh attestation verify (Join-Path $env:RUNNER_TEMP $archive) --repo GitTools/GitVersion
          tar -xzf (Join-Path $env:RUNNER_TEMP $archive) -C $env:RUNNER_TEMP
          $version = (& (Join-Path $env:RUNNER_TEMP gitversion) /output json | ConvertFrom-Json).SemVer
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Unexpected version '$version'" }
          "semver=$version" >> $env:GITHUB_OUTPUT
          "Version: ``$version``" >> $env:GITHUB_STEP_SUMMARY

      - name: Image name and commit time
        id: vars
        run: |
          # Registry paths must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.semver }},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}
            org.opencontainers.image.title=VSeerr
            org.opencontainers.image.description=Seerr with versions: request the same title from several Radarr/Sonarr instances

      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.vars.outputs.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # Only trusted pushes write the build cache; pull requests read it.
          cache-from: type=gha,scope=vseerr-linux-amd64
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=vseerr-linux-amd64' || '' }}
          provenance: false

      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
