---
# Builds the VSeerr container image and publishes it to the GitHub Container
# Registry as ghcr.io/<owner>/<repo>.
#
# Seerr's own image jobs (ci.yml, release.yml) publish to Seerr's registries and
# only run on Seerr's branches, so VSeerr publishes its image here.
#
# Tags:
#   <Seerr version>-vseerr.<VSeerr version>
#                       each build of main, e.g. 3.5.1-vseerr.0.4.2: the Seerr
#                       release it is based on (package.json) plus VSeerr's
#                       own MAJOR.MINOR.PATCH (GitVersion.yml)
#   main                latest build of main
#   sha-<short sha>     one per commit, never moved
#
# Each published version is also a git tag, vseerr-v<VSeerr version>, on the
# commit it was built from; GitVersion counts the next version from it.
#
# Pull requests that touch the image build it without publishing.
name: 'VSeerr Image'

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/vseerr-image.yml
  workflow_dispatch:

permissions: {}

env:
  # renovate: datasource=github-releases depName=GitTools/GitVersion
  GITVERSION_VERSION: '6.8.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Builds of main run one after another and are not cancelled once started:
  # a build that tagged its version also publishes it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A job of its own, with read-only access: GitVersion is a downloaded binary
  # and never runs where the token can publish packages.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      vseerr: ${{ steps.version.outputs.vseerr }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitVersion reads main's history since the vseerr-v0.0.0 tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = "gitversion-linux-x64-$env:GITVERSION_VERSION.tar.gz"
          gh release download $env:GITVERSION_VERSION --repo GitTools/GitVersion --pattern $archive --dir $env:RUNNER_TEMP
          # Only run a GitVersion binary built by GitVersion's own release workflow.
          gh attestation verify (Join-Path $env:RUNNER_TEMP $archive) --repo GitTools/GitVersion
          tar -xzf (Join-Path $env:RUNNER_TEMP $archive) -C $env:RUNNER_TEMP
          $vseerr = (& (Join-Path $env:RUNNER_TEMP gitversion) /output json | ConvertFrom-Json).SemVer
          # The Seerr release VSeerr is based on.
          $seerr = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($seerr -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected Seerr version '$seerr'" }
          # Pull requests get a pre-release label (0.4.3-PullRequest25.1); join it with dots.
          $version = "$seerr-vseerr.$($vseerr -replace '-', '.')"
          # Published tags are exactly <Seerr version>-vseerr.<MAJOR.MINOR.PATCH>,
          # the form deployments follow.
          $pattern = $env:MAIN -eq 'true' ? '^\d+\.\d+\.\d+-vseerr\.\d+\.\d+\.\d+$' : '^\d+\.\d+\.\d+-vseerr\.\d+\.\d+\.\d+(\.[0-9A-Za-z]+)*$'
          if ($version -notmatch $pattern) { throw "Unexpected version '$version'" }
          "semver=$version" >> $env:GITHUB_OUTPUT
          "vseerr=$vseerr" >> $env:GITHUB_OUTPUT
          "Version: ``$version``" >> $env:GITHUB_STEP_SUMMARY

  # Tags the commit with its version before the image is published, so a
  # version is never published twice. Only this job can write to the repo; it
  # runs no downloaded code and does not check the repo out.
  tag:
    name: Tag
    needs: version
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VSEERR_VERSION: ${{ needs.version.outputs.vseerr }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:VSEERR_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version '$env:VSEERR_VERSION'" }
          $tag = "vseerr-v$env:VSEERR_VERSION"
          $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | ConvertFrom-Json
          $existing = ($refs | Where-Object ref -EQ "refs/tags/$tag").object.sha
          if ($existing -eq $env:GITHUB_SHA) {
            # A re-run of this commit's build.
            "``$tag`` is already on this commit." >> $env:GITHUB_STEP_SUMMARY
          } elseif ($existing) {
            throw "$tag already exists on $existing; not publishing it again for $env:GITHUB_SHA."
          } else {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA" --silent
            "Tagged ``$tag``." >> $env:GITHUB_STEP_SUMMARY
          }

  image:
    name: Image
    needs: [version, tag]
    # Pull requests skip the tag job.
    if: ${{ !cancelled() && needs.version.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.tag.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      VERSION: ${{ needs.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and commit time
        id: vars
        run: |
          # Registry paths must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ env.VERSION }},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=VSeerr
            org.opencontainers.image.description=Seerr with versions: request the same title from several Radarr/Sonarr instances

      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.vars.outputs.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # Only trusted pushes write the build cache; pull requests read it.
          cache-from: type=gha,scope=vseerr-linux-amd64
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=vseerr-linux-amd64' || '' }}
          provenance: false

      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
