---
# Fails when a pull request leaves the "AI disclosure" section of the
# template empty. Reads only the pull request description; it does not check
# out or run any code from the pull request.
name: 'VSeerr PR Check'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-disclosure:
    name: AI disclosure
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the AI disclosure section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import os, re, sys

          body = os.environ.get("PR_BODY") or ""
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          match = re.search(r"^##\s*AI disclosure\s*$(.*?)(?=^##\s|\Z)", body, flags=re.S | re.M | re.I)
          if not match or not match.group(1).strip():
              print("::error::Please fill in the 'AI disclosure' section of the pull request description, "
                    "for example 'Written with Claude Code.' or 'None.'")
              sys.exit(1)
          print("AI disclosure: " + " ".join(match.group(1).split())[:300])
          EOF
