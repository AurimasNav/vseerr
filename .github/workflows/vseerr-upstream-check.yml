---
# Checks every new Seerr release against VSeerr and opens an issue with the
# result: whether the release merges cleanly into main, and whether lint,
# type checks, tests and the build pass on the merged code.
#
# The jobs are split so that Seerr's code (and its dependencies' install
# scripts) only ever runs in the `check` job, which has read-only access.
# Only `report`, which runs no Seerr code, can write issues.
name: 'VSeerr Upstream Check'

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect:
    name: Find new Seerr release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      needed: ${{ steps.detect.outputs.needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the latest Seerr release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/seerr-team/seerr/releases/latest --jq .tag_name)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Seerr release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --quiet --no-tags https://github.com/seerr-team/seerr.git \
            "refs/tags/$tag:refs/tags/$tag"
          needed=true
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "Seerr $tag is already merged into main." >> "$GITHUB_STEP_SUMMARY"
            needed=false
          else
            # Open or closed: closing the issue without merging means "not now",
            # so it is not opened again every day.
            existing=$(gh issue list --state all --label upstream-release \
              --search "\"Seerr $tag\" in:title" --json number --jq 'length')
            if [ "$existing" != "0" ]; then
              echo "An issue for Seerr $tag already exists." >> "$GITHUB_STEP_SUMMARY"
              needed=false
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  check:
    name: Merge and test
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      merge: ${{ steps.merge.outputs.merge }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
      kept: ${{ steps.merge.outputs.kept }}
      workflows: ${{ steps.merge.outputs.workflows }}
      lockfile: ${{ steps.merge.outputs.lockfile }}
      install: ${{ steps.install.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      lint: ${{ steps.lint.outcome }}
      test: ${{ steps.test.outcome }}
      roundtrip: ${{ steps.roundtrip.outcome }}
      i18n: ${{ steps.i18n.outcome }}
      build: ${{ steps.build.outcome }}
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before the merge: the merge script uses pnpm to regenerate
      # pnpm-lock.yaml when it conflicts.
      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      # The same script people run to merge a release by hand, so the merge
      # tested here is the merge they get.
      - name: Merge the release into main (locally only)
        id: merge
        shell: pwsh
        run: |
          git config user.name 'vseerr-upstream-check'
          git config user.email 'vseerr-upstream-check@users.noreply.github.com'
          ./bin/Merge-SeerrRelease.ps1 -Tag $env:TAG -OutputFile $env:GITHUB_OUTPUT

      - name: Install dependencies
        id: install
        if: steps.merge.outputs.merge == 'clean'
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm typecheck

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm lint

      - name: Unit tests
        id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CI: true
        run: pnpm test

      - name: Database round trip with Seerr
        id: roundtrip
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm vseerr:roundtrip

      - name: Translation keys
        id: i18n
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node bin/check-i18n.js

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build

  report:
    name: Open issue
    needs: [detect, check]
    if: always() && needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue with the result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ needs.detect.outputs.tag }}
          CHECK_RESULT: ${{ needs.check.result }}
          MERGE: ${{ needs.check.outputs.merge }}
          CONFLICTS: ${{ needs.check.outputs.conflicts }}
          KEPT: ${{ needs.check.outputs.kept }}
          WORKFLOWS: ${{ needs.check.outputs.workflows }}
          LOCKFILE: ${{ needs.check.outputs.lockfile }}
          INSTALL: ${{ needs.check.outputs.install }}
          TYPECHECK: ${{ needs.check.outputs.typecheck }}
          LINT: ${{ needs.check.outputs.lint }}
          TEST: ${{ needs.check.outputs.test }}
          ROUNDTRIP: ${{ needs.check.outputs.roundtrip }}
          I18N: ${{ needs.check.outputs.i18n }}
          BUILD: ${{ needs.check.outputs.build }}
        run: |
          set -euo pipefail
          mark() { case "$1" in success) echo '✅ pass' ;; failure) echo '❌ fail' ;; *) echo '➖ not run' ;; esac; }
          if [ "$CHECK_RESULT" != "success" ]; then
            summary="check did not finish"
          elif [ "$MERGE" = "conflict" ]; then
            summary="merge conflicts"
          elif [ "$INSTALL" = "success" ] && [ "$TYPECHECK" = "success" ] && [ "$LINT" = "success" ] \
            && [ "$TEST" = "success" ] && [ "$ROUNDTRIP" = "success" ] && [ "$I18N" = "success" ] \
            && [ "$BUILD" = "success" ]; then
            summary="merges cleanly, checks pass"
          else
            summary="merges cleanly, checks fail"
          fi
          {
            echo "Seerr [$TAG](https://github.com/seerr-team/seerr/releases/tag/$TAG) is out and not yet merged into \`main\`."
            echo
            echo "**Result:** $summary"
            echo
            if [ "$MERGE" = "conflict" ]; then
              echo "**Files with conflicts:**"
              echo
              for f in $CONFLICTS; do echo "- \`$f\`"; done
              echo
            fi
            if [ "$MERGE" = "clean" ]; then
              echo "| Check | Result |"
              echo "| --- | --- |"
              echo "| Install | $(mark "$INSTALL") |"
              echo "| Type check | $(mark "$TYPECHECK") |"
              echo "| Lint | $(mark "$LINT") |"
              echo "| Unit tests | $(mark "$TEST") |"
              echo "| Database round trip with Seerr | $(mark "$ROUNDTRIP") |"
              echo "| Translation keys | $(mark "$I18N") |"
              echo "| Build | $(mark "$BUILD") |"
              echo
            fi
            if [ "$LOCKFILE" = "regenerated" ]; then
              echo "**pnpm-lock.yaml conflicted.** The merge took Seerr's lockfile and applied VSeerr's \`package.json\` to it with pnpm. The image scan on the pull request shows whether a dependency fix was lost."
              echo
            fi
            if [ -n "$WORKFLOWS" ]; then
              echo "**Workflow files changed upstream.** They run in this repository once merged, so review them first:"
              echo
              for f in $WORKFLOWS; do echo "- \`$f\`"; done
              echo
            fi
            if [ -n "$KEPT" ]; then
              echo "VSeerr's own versions of these files are kept; check the release for anything to copy over by hand: $(for f in $KEPT; do printf '`%s` ' "$f"; done)"
              echo
            fi
            echo "To update, merge the release on a new branch with the same script this check uses, resolve what is listed above, commit, and open a pull request:"
            echo
            echo '```sh'
            echo "git switch -c seerr-$TAG origin/main"
            echo "pwsh ./bin/Merge-SeerrRelease.ps1 -Tag $TAG"
            echo '```'
            echo
            echo "[Workflow run]($RUN_URL)"
          } > /tmp/body.md
          gh label create upstream-release --color 0e8a16 \
            --description 'A new Seerr release to merge' 2>/dev/null || true
          gh issue create --title "Seerr $TAG: $summary" --label upstream-release --body-file /tmp/body.md
