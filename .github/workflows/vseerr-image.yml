---
# Builds the VSeerr container image and publishes it to the GitHub Container
# Registry as ghcr.io/<owner>/<repo>.
#
# Seerr's own image jobs (ci.yml, release.yml) publish to Seerr's registries and
# only run on Seerr's branches, so VSeerr publishes its image here.
#
# Tags:
#   <Seerr version>-vseerr.<VSeerr version>
#                       each build of main, e.g. 3.5.1-vseerr.2.118.0: the Seerr
#                       release it is based on (package.json) plus VSeerr's
#                       own MAJOR.MINOR.PATCH (GitVersion.yml)
#   main                latest build of main
#   sha-<short sha>     one per commit of main
#
# Only main publishes, and a version tag is never overwritten: re-running a
# build that was already published skips publishing. Pull requests that touch
# the image, and manual runs on other branches, build it without publishing.
#
# Those unpublished builds are scanned with Trivy, which reads the image's
# system packages and the Node.js packages it ships. The scan fails on a high
# or critical vulnerability with a fix available that the published image of
# the base commit does not have. The published image itself is scanned daily
# by vseerr-security.yml, which reports to the Security tab.
#
# Each published image carries an SBOM and build provenance, and GitHub signs
# an attestation for it. To check that an image was built here:
#   gh attestation verify oci://ghcr.io/aurimasnav/vseerr:<tag> --repo AurimasNav/vseerr
name: 'VSeerr Image'

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/vseerr-image.yml
  workflow_dispatch:

permissions: {}

env:
  # renovate: datasource=github-releases depName=GitTools/GitVersion
  GITVERSION_VERSION: '6.8.2'
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: '0.76.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A job of its own, with read-only access: GitVersion is a downloaded binary
  # and never runs where the token can publish packages.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitVersion reads the whole history of main.
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = "gitversion-linux-x64-$env:GITVERSION_VERSION.tar.gz"
          gh release download $env:GITVERSION_VERSION --repo GitTools/GitVersion --pattern $archive --dir $env:RUNNER_TEMP
          # Only run a GitVersion binary built by GitVersion's own release workflow.
          gh attestation verify (Join-Path $env:RUNNER_TEMP $archive) --repo GitTools/GitVersion
          tar -xzf (Join-Path $env:RUNNER_TEMP $archive) -C $env:RUNNER_TEMP
          $vseerr = (& (Join-Path $env:RUNNER_TEMP gitversion) /output json | ConvertFrom-Json).SemVer
          # The Seerr release VSeerr is based on.
          $seerr = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($seerr -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected Seerr version '$seerr'" }
          # Pull requests get a pre-release label (2.118.0-PullRequest25.1); join it with dots.
          $version = "$seerr-vseerr.$($vseerr -replace '-', '.')"
          # Published tags are exactly <Seerr version>-vseerr.<MAJOR.MINOR.PATCH>,
          # the form deployments follow.
          $pattern = $env:MAIN -eq 'true' ? '^\d+\.\d+\.\d+-vseerr\.\d+\.\d+\.\d+$' : '^\d+\.\d+\.\d+-vseerr\.\d+\.\d+\.\d+(\.[0-9A-Za-z]+)*$'
          if ($version -notmatch $pattern) { throw "Unexpected version '$version'" }
          "semver=$version" >> $env:GITHUB_OUTPUT
          "Version: ``$version``" >> $env:GITHUB_STEP_SUMMARY

  image:
    name: Image
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Signing the build attestation.
      id-token: write
      attestations: write
    env:
      MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      VERSION: ${{ needs.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and commit time
        id: vars
        run: |
          # Registry paths must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      # A published version tag is never moved: re-running a build of main
      # that was already published skips publishing instead of replacing the
      # image with a new digest. A tag already published from another commit
      # fails the build.
      - name: Check the version is not published yet
        id: published
        if: env.MAIN == 'true'
        shell: pwsh
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          $repository = $env:IMAGE -replace '^ghcr\.io/', ''
          $token = (Invoke-RestMethod "https://ghcr.io/token?scope=repository:${repository}:pull&service=ghcr.io").token
          $headers = @{
            Authorization = "Bearer $token"
            Accept = 'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          }
          $registry = "https://ghcr.io/v2/$repository"
          $manifest = Invoke-RestMethod "$registry/manifests/$env:VERSION" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable status
          if ($status -eq 404) {
            'publish=true' >> $env:GITHUB_OUTPUT
            return
          }
          if ($status -ne 200) {
            throw "Could not check whether $env:VERSION is published: HTTP $status"
          }
          if ($manifest.manifests) {
            $image = $manifest.manifests | Where-Object { $_.platform.os -eq 'linux' -and $_.platform.architecture -eq 'amd64' } | Select-Object -First 1
            $manifest = Invoke-RestMethod "$registry/manifests/$($image.digest)" -Headers $headers
          }
          $config = Invoke-RestMethod "$registry/blobs/$($manifest.config.digest)" -Headers @{ Authorization = "Bearer $token" }
          $revision = $config.config.Labels.'org.opencontainers.image.revision'
          if ($revision -ne $env:GITHUB_SHA) {
            throw "$env:VERSION is already published from commit $revision, not $env:GITHUB_SHA. Not overwriting it."
          }
          'publish=false' >> $env:GITHUB_OUTPUT
          "``$env:VERSION`` is already published from this commit; not publishing it again." >> $env:GITHUB_STEP_SUMMARY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: steps.published.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ env.VERSION }},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=VSeerr
            org.opencontainers.image.description=Seerr with versions: request the same title from several Radarr/Sonarr instances

      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ steps.published.outputs.publish == 'true' }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.vars.outputs.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # The cache is kept in the registry, where only this job can write
          # (packages: write). A GitHub Actions cache can be written by any
          # job running on main, including the upstream check, which runs
          # Seerr's code and its dependencies' install scripts.
          cache-from: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache
          cache-to: ${{ steps.published.outputs.publish == 'true' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', steps.vars.outputs.image) || '' }}
          provenance: ${{ steps.published.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.published.outputs.publish == 'true' }}
          # Builds that are not published are saved for the image scan.
          outputs: ${{ env.MAIN != 'true' && format('type=docker,name=vseerr-scan,dest={0}/image.tar', runner.temp) || '' }}

      - name: Save the image for the scan
        if: env.MAIN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1
          # The layers are already compressed.
          compression-level: 0

      - name: Sign the build attestation
        if: steps.published.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: steps.published.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A job of its own, without the publishing token: Trivy is a downloaded
  # binary.
  scan:
    name: Image scan (new vulnerabilities)
    needs: image
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Install Trivy (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$(mktemp -d)"
          tv="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL --retry 3 -o "$tv" "$base/$tv"
          curl -fsSL --retry 3 -o sums "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $tv\$" sums | sha256sum -c -
          tar xzf "$tv" -C "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Scan the image and the published base image
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $scan = '--scanners', 'vuln', '--severity', 'HIGH,CRITICAL', '--ignore-unfixed', '--format', 'json', '--quiet'
          trivy image @scan --output head.json --input (Join-Path $env:RUNNER_TEMP image.tar)
          $image = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())"
          # Each commit of main is published as sha-<short sha>.
          $base = $env:BASE_SHA ? "${image}:sha-$($env:BASE_SHA.Substring(0, 7))" : "${image}:main"
          try {
            trivy image @scan --output base.json $base
          } catch {
            "::warning::Could not scan $base; comparing with ${image}:main instead."
            $base = "${image}:main"
            trivy image @scan --output base.json $base
          }
          "Compared with ``$base``." >> $env:GITHUB_STEP_SUMMARY

      - name: Fail on vulnerabilities the base image does not have
        shell: pwsh
        run: |
          # Keyed without the installed version, so a rebuild that still has an
          # already-known vulnerability is not "new".
          function Get-Finding([string] $Path) {
            $findings = @{}
            foreach ($result in @((Get-Content $Path -Raw | ConvertFrom-Json).Results)) {
              foreach ($v in @($result.Vulnerabilities)) {
                if ($null -ne $v) { $findings["$($result.Type)|$($v.PkgName)|$($v.VulnerabilityID)"] = $v }
              }
            }
            return $findings
          }
          $base = Get-Finding base.json
          $head = Get-Finding head.json
          $new = @($head.Keys | Where-Object { -not $base.ContainsKey($_) } | Sort-Object)
          if ($new.Count -eq 0) {
            $line = "No new fixable high or critical vulnerabilities in the image ($($head.Count) inherited from the base image)."
            $line
            $line >> $env:GITHUB_STEP_SUMMARY
            return
          }
          @('| Severity | Package | Installed | Fixed in | ID | Where |', '| --- | --- | --- | --- | --- | --- |') >> $env:GITHUB_STEP_SUMMARY
          foreach ($key in $new) {
            $v = $head[$key]
            $where = $v.PkgPath ? $v.PkgPath : $key.Split('|')[0]
            "::error::$($v.Severity) $($v.PkgName) $($v.InstalledVersion) -> $($v.FixedVersion) $($v.VulnerabilityID) ($where)"
            "| $($v.Severity) | $($v.PkgName) | $($v.InstalledVersion) | $($v.FixedVersion) | $($v.VulnerabilityID) | $where |" >> $env:GITHUB_STEP_SUMMARY
          }
          "$($new.Count) new fixable high or critical vulnerabilities in the image."
          exit 1
